name: Build and publish ARM64 browser image
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Test launcher and input metadata
        run: |
          python3 -m unittest discover -s tests -v
          chmod +x tests/fixtures/browser.py
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build runtime for validation
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          target: workload
          load: true
          tags: workload-embedded-browser:ci
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate image and inherited dashboard
        run: |
          python3 tests/check_image_startup.py workload-embedded-browser:ci
          docker run --rm --workdir / --tmpfs /run --tmpfs /tmp workload-embedded-browser:ci smoke
          docker build --builder default --build-arg BROWSER_IMAGE=workload-embedded-browser:ci -t embedded-dashboard:ci examples/dashboard
          docker run --rm embedded-dashboard:ci /usr/bin/python3 -c "from pathlib import Path; assert 'Embedded dashboard' in Path('/opt/dashboard/www/index.html').read_text()"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish validated runtime
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          target: workload
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha
